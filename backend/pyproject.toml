[project]
name = "docintel"
version = "0.1.0"
description = "Documentation Intelligence AI — evidence-grounded retrieval over versioned documentation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Architectural boundaries from docs/ARCHITECTURE.md §22, enforced rather than intended.
# The ban is declared globally and then lifted for the layers allowed to cross it, so
# it stays in force exactly where it matters: app/api/** and app/domain/**.
"app.adapters".msg = "api/ and domain/ must not import adapters/ — go through services/"

[tool.ruff.lint.per-file-ignores]
"app/services/**" = ["TID251"]
"app/adapters/**" = ["TID251"]
"app/main.py" = ["TID251"]
"worker/**" = ["TID251"]
"tests/**" = ["TID251"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live PostgreSQL"]
