services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: docintel
      POSTGRES_DB: docintel
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://docintel:docintel@postgres:5432/docintel
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./backend:/srv"]

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://docintel:docintel@postgres:5432/docintel
    depends_on:
      postgres: {condition: service_healthy}
    command: python -m worker.main
    volumes: ["./backend:/srv"]

volumes:
  pgdata:
