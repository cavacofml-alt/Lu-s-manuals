name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docintel
          POSTGRES_PASSWORD: docintel
          POSTGRES_DB: docintel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docintel"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://docintel:docintel@localhost:5432/docintel
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: No unreviewed egress bypass
        run: |
          # Every unwrap_unchecked is a deliberate review decision (§8.1.1).
          # This fails the build when a new one appears, so it cannot become habit.
          count=$(grep -rn 'unwrap_unchecked(' app worker | grep -v 'def unwrap_unchecked' | wc -l)
          echo "unwrap_unchecked call sites: $count"
          test "$count" -le 0 || { echo "New egress bypass added — review required"; exit 1; }
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app worker
      - run: alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
